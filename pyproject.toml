[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sleepsplit"
version = "0.1.0"
description = "Split long MP3 audiobooks into bedtime-friendly listening segments."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["mutagen>=1.48.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/sleepsplit"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11"]

[project.scripts]
sleepsplit = "sleepsplit.cli:main"
